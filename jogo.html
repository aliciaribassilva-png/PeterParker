<!--JOGO-->
<!-- Área Principal do Jogo (Colar entre o Cabeçalho/Menu e o Rodapé) -->
<main class="jogo-container">
    <div class="jogo-wrapper" id="jogoWrapper">
        <!-- Tela de Instruções / Game Over sobreposta -->
        <div id="telaInfo" class="tela-info">
            <p id="textoInfo">Pressione ESPAÇO ou TOQUE para iniciar</p>
        </div>
        
        <!-- Canvas onde o jogo é renderizado -->
        <canvas id="canvasJogo" width="600" height="150"></canvas>
    </div>
    
    <!-- Controles e Pontuação externa (opcional, já que fica na tela) -->
    <div class="jogo-controles">
        <button id="btnTelaCheia" class="btn-jogo">📺 Tela Cheia</button>
    </div>
</main>





<!-- RODAPÉ -->
<footer class="escola" id="contato">

    <img class="logo_rodape" src="twink.jpg"
    alt="Logo da Escola">

    <h2 class="escola-título">
        <a class="link" href=""></a>
    </h2>

    <p></p>

</footer>
